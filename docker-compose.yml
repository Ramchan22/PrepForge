version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://prepforge_user:prepforge_pass@postgres:5432/prepforge_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=prepforge_super_secret_production_key_2026
      - JWT_REFRESH_SECRET=prepforge_super_refresh_secret_key_2026
      - NEXT_OUTPUT=standalone
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: prepforge_user
      POSTGRES_PASSWORD: prepforge_pass
      POSTGRES_DB: prepforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
